<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Admin Login | ProjectHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/public.css">
    <link rel="stylesheet" href="assets/css/admin.css">
    <link rel="stylesheet" href="assets/css/showroom.css">
</head>
<body>
    <div id="site-header"></div>
    <main class="shell page-main admin-page">
        <section class="admin-auth-card">
            <span class="eyebrow">PROJECTHUB ADMIN</span>
            <h1>Welcome back.</h1>
            <p>Sign in with your authorised admin account to manage client submissions.</p>
            <form id="admin-login-form">
                <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="username" required></div>
                <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
                <p id="login-message" class="admin-message" role="status" aria-live="polite"></p>
                <button class="btn primary" type="submit">Sign in <span>↗</span></button>
            </form>
            <a class="admin-back-link" href="team.html">← Back to About</a>
        </section>
    </main>
    <div id="site-footer"></div>
    <script type="module" src="assets/js/data.js"></script>
    <script type="module" src="assets/js/common.js"></script>
    <script type="module" src="assets/js/public-effects.js"></script>
    <script type="module" src="assets/js/admin-login.js"></script>
</body>
</html>
